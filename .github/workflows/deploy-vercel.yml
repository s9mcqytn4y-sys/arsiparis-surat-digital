name: Deploy to Vercel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Demo to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Vercel Token Availability
        id: check-token
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Notice: VERCEL_TOKEN is not configured in repository secrets. Deployment will be managed directly via Vercel GitHub Git Integration."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets['VERCEL_TOKEN'] }}

      - name: Setup Node.js 22 LTS
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        if: steps.check-token.outputs.has_token == 'true'
        run: npm ci

      - name: Build Frontend Assets (Vite + Tailwind 4)
        if: steps.check-token.outputs.has_token == 'true'
        run: npm run build

      - name: Deploy to Vercel (Production)
        if: steps.check-token.outputs.has_token == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets['VERCEL_TOKEN'] }}
          vercel-org-id: ${{ secrets['VERCEL_ORG_ID'] }}
          vercel-project-id: ${{ secrets['VERCEL_PROJECT_ID'] || 'hxXMoBd1YiygqaufBHkXHAbb' }}
          vercel-args: '--prod'
